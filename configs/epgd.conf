# ---------------
# sngtv plugin
# ---------------

# Pictures (0/1, default 0 = off)
#
#   ATTENTION: The pictures are licensed third-party content (press pictures of
#   the broadcasters / picture agencies). Enable them only for your private use
#   and never make your epgd / web interface reachable from the internet with
#   them enabled. See README of the sngtv plugin.
#   Additionally the global option 'GetEPGImages' has to be enabled.

sngtv.images = 0

# preferred picture type if more than one is offered
#   1 = 4:3 (1440x1080), 17 = 16:9 (1920x1080), 18 = background (1920x1080)

sngtv.imageType = 17

# scale pictures down to fit into this box (0 = keep original size, up to 1920x1080)

sngtv.imageMaxWidth = 960
sngtv.imageMaxHeight = 540
sngtv.imageQuality = 80

# pause between two requests [ms] - be gentle to the server

sngtv.requestDelay = 250

# request timeout [s]

sngtv.timeout = 30

# Debug Options (files are stored in <CachePath>/sngtv)

sngtv.saveJson = 0
sngtv.saveXml = 0
